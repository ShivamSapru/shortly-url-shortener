$kind: http-request
url: "{{baseUrl}}/{{shortCode}}"
method: GET
headers:
  Referer: https://news.example/
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 302 Found', () => pm.response.to.have.status(302));
      pm.test('Location is the original long URL', () => {
        pm.expect(pm.response.headers.get('Location')).to.eql(pm.collectionVariables.get('longUrl'));
      });
    language: text/javascript
settings:
  followRedirects: false
order: 5000
