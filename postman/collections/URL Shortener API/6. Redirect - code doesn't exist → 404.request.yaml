$kind: http-request
url: "{{baseUrl}}/zzzzzzz"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 404 Not Found', () => pm.response.to.have.status(404));
      pm.test('error says not found', () => {
        pm.expect(pm.response.json().error).to.eql('Short URL not found');
      });
    language: text/javascript
settings:
  followRedirects: false
order: 6000
